name: Test nextstrain run

on:
  workflow_dispatch:


jobs:
  nextstrain_run:
    runs-on: ubuntu-latest
    env:
      MEASLES_SHA: 7b0465906a15fd1e89ec0904dbb80af0474676e7
      EXAMPLE_DIR: phylogenetic/custom-analyses/north-america-outbreak-example/
      ANALYSIS_DIR: analysis-directory/
    steps:
      - uses: nextstrain/.github/actions/setup-nextstrain-cli@master
      - run: nextstrain setup docker
      - name: Setup pathogen
        run: nextstrain setup measles@${{ env.MEASLES_SHA }}

      - name: Checkout analysis directory
        uses: actions/checkout@v7
        with:
          repository: nextstrain/measles
          ref: ${{ env.MEASLES_SHA }}
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.EXAMPLE_DIR }}
          path: ${{ env.ANALYSIS_DIR }}

      - name: Setup analysis directory
        run: |
          mv ${{ env.ANALYSIS_DIR }}${{ env.EXAMPLE_DIR }}* ${{ env.ANALYSIS_DIR }}

        # TODO: run other workflows
      - name: Run phylo example
        run: nextstrain run measles@${{ env.MEASLES_SHA }} phylogenetic ${{ env.ANALYSIS_DIR }}
